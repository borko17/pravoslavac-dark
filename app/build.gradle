plugins {
    alias libs.plugins.android.application
}

// Potpisivanje: ako su postavljene varijable okruzenja (npr. iz GitHub Secrets) koristi se vas kljuc,
// inace se release APK potpisuje debug kljucem (samo za testiranje).
def ksFile = System.getenv('KEYSTORE_FILE')

android {
    namespace 'patch.kalendar'
    compileSdk {
        version = release(37)
    }


    defaultConfig {
        // Ime paketa kako ga vidi telefon (LSPosed, instalacija). Java paket i 'namespace' ispod ostaju isti.
        applicationId 'com.pravoslavac.dark'
        minSdk 21
        //noinspection TargetSdkVersion
        targetSdk 37
        // versionCode: cijeli broj, povecaj za 1 pri SVAKOM novom izdanju. versionName: tekst koji se prikazuje (i ulazi u ime APK-a).
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        if (ksFile) {
            release {
                storeFile file(ksFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Xposed API je samo za kompajliranje; u runtime-u ga daje LSPosed.
    compileOnly project(':xposed-api-stub')
}
