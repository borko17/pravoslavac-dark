name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Pripremi keystore (ako je postavljen secret KEYSTORE_B64)
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: UPOZORENJE ako nema kljuca
        if: env.KEYSTORE_B64 == ''
        run: echo "::warning::Secret KEYSTORE_B64 je prazan ili ne postoji - APK ce biti potpisan privremenim debug kljucem (svaki build drugi)!"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Preimenuj APK (ime dobija verziju iz app/build.gradle)
        run: |
          VERSION=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" app/build.gradle)
          APK_NAME="Pravoslavac_Patch_${VERSION}.apk"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/${APK_NAME}"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"

      - name: Prikazi potpis APK-a (vlasnik i otisak)
        run: keytool -printcert -jarfile "dist/${APK_NAME}" | head -n 12

      - uses: actions/upload-artifact@v4
        with:
          name: Pravoslavac_Patch
          path: dist/${{ env.APK_NAME }}

      - name: Dodaj APK u GitHub Release (za tagove v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.APK_NAME }}
